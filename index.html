<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex-CPS Actuator Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="manifest" href="manifest.json" />
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="font-bold text-lg tracking-wide" id="ui-title">Apex-CPS Actuator (Yaw / Pitch)</h1>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Language Selector -->
            <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded px-2 py-1.5 focus:outline-none">
                <option value="en">English</option>
                <option value="hi">हिंदी (Hindi)</option>
                <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
            </select>
            <button onclick="downloadBlackboxCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded transition" id="ui-btn-csv">📥 Blackbox CSV</button>
            <button id="estop-btn" onclick="toggleEstop()" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded transition shadow-lg">E-STOP: OFF</button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 relative overflow-hidden">
        <!-- 3D Digital Twin Viewport -->
        <div id="canvas-container" class="flex-1 h-full cursor-grab"></div>

        <!-- Right Control Panel -->
        <aside class="w-80 bg-slate-900/90 backdrop-blur border-l border-slate-800 p-4 flex flex-col space-y-4 overflow-y-auto z-10">
            <div>
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="ui-telemetry-hdr">Real-Time Telemetry</h2>
                <div class="bg-slate-950/60 rounded-lg p-3 border border-slate-800 space-y-2 text-xs">
                    <div class="flex justify-between"><span class="text-slate-400" id="ui-yaw">Yaw Angle:</span> <span id="val-yaw" class="font-mono text-emerald-400">0.00 rad</span></div>
                    <div class="flex justify-between"><span class="text-slate-400" id="ui-pitch">Pitch Angle:</span> <span id="val-pitch" class="font-mono text-emerald-400">0.00 rad</span></div>
                    <div class="flex justify-between"><span class="text-slate-400" id="ui-iq">Iq Current:</span> <span id="val-iq" class="font-mono text-cyan-400">0.00 A</span></div>
                    <div class="flex justify-between"><span class="text-slate-400" id="ui-temp">Inverter Temp:</span> <span id="val-temp" class="font-mono text-amber-400">42.0 °C</span></div>
                    <div class="flex justify-between"><span class="text-slate-400" id="ui-state">Inverter State:</span> <span id="val-state" class="font-bold text-emerald-400">ARMED</span></div>
                </div>
            </div>

            <!-- Advanced Regional Control Toggles & Sliders -->
            <div>
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="ui-control-hdr">Advanced Control Tuning</h2>
                <div class="bg-slate-950/60 rounded-lg p-3 border border-slate-800 space-y-3 text-xs">
                    <div>
                        <div class="flex justify-between mb-1"><span id="ui-kp">Position Kp:</span> <span id="val-kp" class="font-mono">15.0</span></div>
                        <input type="range" min="5" max="30" step="0.5" value="15" oninput="updateKp(this.value)" class="w-full accent-emerald-500">
                    </div>
                    <div>
                        <div class="flex justify-between mb-1"><span id="ui-friction">Friction Comp (LuGre):</span> <span id="val-friction" class="font-mono">0.8 A</span></div>
                        <input type="range" min="0" max="2.0" step="0.1" value="0.8" oninput="updateFriction(this.value)" class="w-full accent-emerald-500">
                    </div>
                    <div class="flex items-center justify-between pt-1 border-t border-slate-800">
                        <span id="ui-notch">250Hz Biquad Notch</span>
                        <input type="checkbox" id="notch-toggle" checked class="accent-emerald-500 w-4 h-4 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Quick Motion Presets -->
            <div>
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2" id="ui-presets-hdr">Motion Presets</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setTarget(0, 0)" class="bg-slate-800 hover:bg-slate-700 py-2 rounded text-xs font-medium transition" id="ui-home">Home (0,0)</button>
                    <button onclick="setTarget(1.57, 0.78)" class="bg-slate-800 hover:bg-slate-700 py-2 rounded text-xs font-medium transition" id="ui-sweep">Sweep Test</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- Localization Dictionary -->
    <script>
        const i18n = {
            en: {
                title: "Apex-CPS Actuator (Yaw / Pitch)",
                btnCsv: "📥 Blackbox CSV",
                telemetryHdr: "Real-Time Telemetry",
                yaw: "Yaw Angle:",
                pitch: "Pitch Angle:",
                iq: "Iq Current:",
                temp: "Inverter Temp:",
                state: "Inverter State:",
                controlHdr: "Advanced Control Tuning",
                kp: "Position Kp:",
                friction: "Friction Comp (LuGre):",
                notch: "250Hz Biquad Notch",
                presetsHdr: "Motion Presets",
                home: "Home (0,0)",
                sweep: "Sweep Test"
            },
            hi: {
                title: "Apex-CPS एक्चुएटर (Yaw / Pitch)",
                btnCsv: "📥 ब्लैकबॉक्स CSV",
                telemetryHdr: "रियल-टाइम टेलीमेट्री",
                yaw: "Yaw कोण:",
                pitch: "Pitch कोण:",
                iq: "Iq करंट:",
                temp: "इन्वर्टर तापमान:",
                state: "इन्वर्टर स्थिति:",
                controlHdr: "उन्नत नियंत्रण ट्यूनिंग",
                kp: "पोजीशन Kp:",
                friction: "घर्षण मुआवजा (LuGre):",
                notch: "250Hz बiquad नॉच",
                presetsHdr: "मोशन प्रीसेट",
                home: "होम (0,0)",
                sweep: "स्वीप टेस्ट"
            },
            pa: {
                title: "Apex-CPS ਐਕਚੁਏਟਰ (Yaw / Pitch)",
                btnCsv: "📥 ਬਲੈਕਬਾਕਸ CSV",
                telemetryHdr: "ਰੀਅਲ-ਟਾਈਮ ਟੈਲੀਮੈਟਰੀ",
                yaw: "Yaw ਕੋਣ:",
                pitch: "Pitch ਕੋਣ:",
                iq: "Iq ਕਰੰਟ:",
                temp: "ਇਨਵਰਟਰ ਤਾਪਮਾਨ:",
                state: "ਇਨਵਰਟਰ ਸਥਿਤੀ:",
                controlHdr: "ਉੱਨਤ ਕੰਟਰੋਲ ਟਿਊਨਿੰਗ",
                kp: "ਪੋਜੀਸ਼ਨ Kp:",
                friction: "ਰਗੜ ਮੁਆਵਜ਼ਾ (LuGre):",
                notch: "250Hz ਬਾਇਕਵਾਡ ਨੌਚ",
                presetsHdr: "ਮੋਸ਼ਨ ਪ੍ਰੀਸੈੱਟ",
                home: "ਘਰ (0,0)",
                sweep: "ਸਵੀਪ ਟੈਸਟ"
            }
        };

        function changeLanguage(lang) {
            const t = i18n[lang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-btn-csv').innerText = t.btnCsv;
            document.getElementById('ui-telemetry-hdr').innerText = t.telemetryHdr;
            document.getElementById('ui-yaw').innerText = t.yaw;
            document.getElementById('ui-pitch').innerText = t.pitch;
            document.getElementById('ui-iq').innerText = t.iq;
            document.getElementById('ui-temp').innerText = t.temp;
            document.getElementById('ui-state').innerText = t.state;
            document.getElementById('ui-control-hdr').innerText = t.controlHdr;
            document.getElementById('ui-kp').innerText = t.kp;
            document.getElementById('ui-friction').innerText = t.friction;
            document.getElementById('ui-notch').innerText = t.notch;
            document.getElementById('ui-presets-hdr').innerText = t.presetsHdr;
            document.getElementById('ui-home').innerText = t.home;
            document.getElementById('ui-sweep').innerText = t.sweep;
        }

        function updateKp(val) { document.getElementById('val-kp').innerText = val; }
        function updateFriction(val) { document.getElementById('val-friction').innerText = val + " A"; }
    </script>

    <!-- Three.js 3D Digital Twin Rendering Script -->
    <script>
        let scene, camera, renderer, actuatorGroup;
        let actualYaw = 0, actualPitch = 0;
        let targetYaw = 0, targetPitch = 0;
        let estopActive = false;
        let inverterTemp = 42.0;

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(3, 2, 3);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Grid Floor
            const grid = new THREE.GridHelper(10, 10, 0x1e293b, 0x1e293b);
            grid.position.y = -1;
            scene.add(grid);

            // Actuator 3D Model Construction (Yaw / Pitch Gimbal)
            actuatorGroup = new THREE.Group();
            
            // Base Mount
            const baseGeo = new THREE.CylinderGeometry(0.6, 0.7, 0.4, 32);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.2 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.y = -0.8;
            actuatorGroup.add(base);

            // Yaw Axis Housing
            const yawGeo = new THREE.BoxGeometry(0.8, 0.6, 0.8);
            const motorMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, metalness: 0.5, roughness: 0.3 });
            const yawMesh = new THREE.Mesh(yawGeo, motorMat);
            yawMesh.position.y = -0.3;
            actuatorGroup.add(yawMesh);

            scene.add(actuatorGroup);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function toggleEstop() {
            estopActive = !estopActive;
            const btn = document.getElementById('estop-btn');
            const stateVal = document.getElementById('val-state');
            if (estopActive) {
                btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded transition shadow-lg";
                btn.innerText = "E-STOP: ACTIVE (RESET)";
                stateVal.innerText = "E-STOP TRIPPED";
                stateVal.className = "font-bold text-rose-500";
            } else {
                btn.className = "bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold px-3 py-1.5 rounded transition shadow-lg";
                btn.innerText = "E-STOP: OFF";
                stateVal.innerText = "ARMED";
                stateVal.className = "font-bold text-emerald-400";
            }
        }

        function setTarget(y, p) {
            targetYaw = y;
            targetPitch = p;
        }

        // In-Browser Blackbox Telemetry Recorder
        let blackboxLog = [];
        setInterval(() => {
            if (!estopActive) {
                // Smooth interpolation toward target
                actualYaw += (targetYaw - actualYaw) * 0.1;
                actualPitch += (targetPitch - actualPitch) * 0.1;
                
                document.getElementById('val-yaw').innerText = actualYaw.toFixed(2) + " rad";
                document.getElementById('val-pitch').innerText = actualPitch.toFixed(2) + " rad";
                document.getElementById('val-iq').innerText = (Math.sin(Date.now() * 0.005) * 1.5 + 1.8).toFixed(2) + " A";

                blackboxLog.push({
                    timestamp: new Date().toISOString(),
                    yaw: actualYaw,
                    pitch: actualPitch,
                    temp: inverterTemp,
                    estop: estopActive
                });
                if (blackboxLog.length > 3000) blackboxLog.shift();
            }
        }, 100);

        function downloadBlackboxCSV() {
            if (blackboxLog.length === 0) { alert('No telemetry recorded yet.'); return; }
            let csv = 'timestamp,yaw_rad,pitch_rad,inverter_temp_c,estop\n';
            blackboxLog.forEach(row => {
                csv += `${row.timestamp},${row.yaw.toFixed(4)},${row.pitch.toFixed(4)},${row.temp.toFixed(1)},${row.estop}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `apex_blackbox_${Date.now()}.csv`);
            a.click();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (actuatorGroup && !estopActive) {
                actuatorGroup.rotation.y = actualYaw;
            }
            renderer.render(scene, camera);
        }

        init3D();
        animate();

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
        }
    </script>
</body>
</html>
