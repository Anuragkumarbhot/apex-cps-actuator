name: Apex-CPS CI & HIL Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets pandas matplotlib numpy

      - name: Build & Run C Firmware Unit Tests
        run: |
          cd firmware
          mkdir -p build && cd build
          cmake ..
          make
          ctest --output-on-failure

      - name: Run Closed-Loop Plant Simulation
        run: |
          python3 simulation/actuator_plant_sim.py
