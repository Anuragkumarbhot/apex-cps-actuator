name: Apex-CPS CI & HIL Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build & Run C Firmware Unit Tests (FOC, Notch, Thermal, Watchdog)
        run: |
          cd firmware
          mkdir -p build && cd build
          cmake ..
          make
          ctest --output-on-failure

      - name: Run Automated Python HIL Test Suite
        run: |
          python3 tests/hil_test_runner.py
