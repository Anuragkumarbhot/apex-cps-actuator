name: Firmware CI & Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Run FOC Unit Tests
        run: |
          cd firmware
          mkdir -p build && cd build
          cmake ..
          make
          ctest --output-on-failure
